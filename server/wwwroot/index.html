<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>9mRoom · 调试台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">9mRoom<span>dev console</span></div>
    <div class="conn" id="conn" data-state="off">未连接</div>
  </header>

  <main>
    <section class="panel room">
      <div class="controls">
        <label>房间 <input id="room" value="demo" spellcheck="false"></label>
        <label>名字 <input id="name" value="观察者" spellcheck="false"></label>
        <button id="connect" class="primary">连接</button>
        <button id="add-fakes">添加 3 个假用户</button>
        <button id="clear-fakes">清空假用户</button>
      </div>
      <div class="meta">
        <span id="count">0 人</span>
        <span class="sep">·</span>
        <span id="clock"></span>
        <span class="sep">·</span>
        <span class="hint">调试台不参与真实数据上报</span>
      </div>
      <ul id="members" class="members"></ul>
      <div id="empty" class="empty">还没有人。点「添加 3 个假用户」看看效果。</div>
    </section>

    <aside class="panel log">
      <div class="log-head">
        <strong>事件</strong>
        <button id="clear-log">清空</button>
      </div>
      <ol id="log"></ol>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
