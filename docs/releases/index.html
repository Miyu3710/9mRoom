<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>9mRoom · 下载中心</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>

  <main class="shell">
    <header class="hero">
      <a class="brand" href="https://github.com/Miyu3710/9mRoom">
        <span class="brand-mark">9</span>
        <span>9mRoom</span>
      </a>
      <p class="eyebrow">DOWNLOAD CENTER</p>
      <h1>选择你的端</h1>
      <p class="lede">三端独立发布，互不影响。点击任意一端查看该端的全部版本与下载。</p>
    </header>

    <section class="platform-grid">
      <a class="platform-card windows" href="./platform.html?platform=windows">
        <div class="platform-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 4.5 10.5 3v8H3V4.5Zm8.5-1.7L21 1.5v9.5h-9.5V2.8ZM3 12h7.5v8L3 18.5V12Zm8.5 0H21v9.5l-9.5-1.3V12Z"/></svg>
        </div>
        <div class="platform-copy">
          <span class="platform-kicker">WINDOWS</span>
          <h2>Windows 客户端</h2>
          <p>MSI 安装包 / 便携版</p>
          <div class="version-line">
            <span class="dot"></span>
            <span data-latest="windows">读取最新版本…</span>
          </div>
        </div>
        <span class="arrow">→</span>
      </a>

      <a class="platform-card server" href="./platform.html?platform=server">
        <div class="platform-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 3h16v6H4V3Zm0 12h16v6H4v-6Zm3-9h1v1H7V6Zm0 12h1v1H7v-1Zm4-12h6v1h-6V6Zm0 12h6v1h-6v-1Z"/></svg>
        </div>
        <div class="platform-copy">
          <span class="platform-kicker">SERVER</span>
          <h2>Linux 服务端</h2>
          <p>自包含包 / Docker</p>
          <div class="version-line">
            <span class="dot"></span>
            <span data-latest="server">读取最新版本…</span>
          </div>
        </div>
        <span class="arrow">→</span>
      </a>

      <a class="platform-card android" href="./platform.html?platform=android">
        <div class="platform-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 8h10a1 1 0 0 1 1 1v8a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9a1 1 0 0 1 1-1Zm1.2-2.2 1.1-1.9.9.5-1.1 2a6.4 6.4 0 0 1 4 0l-1.1-2 .9-.5 1.1 1.9A5.5 5.5 0 0 1 17 9H7a5.5 5.5 0 0 1 1.2-3.2ZM9 11v1h1v-1H9Zm5 0v1h1v-1h-1ZM7 19h10v1H7v-1Z"/></svg>
        </div>
        <div class="platform-copy">
          <span class="platform-kicker">ANDROID</span>
          <h2>Android 客户端</h2>
          <p>APK 直接安装</p>
          <div class="version-line">
            <span class="dot"></span>
            <span data-latest="android">读取最新版本…</span>
          </div>
        </div>
        <span class="arrow">→</span>
      </a>
    </section>

    <footer class="footer">
      <span>所有版本与校验文件来自 GitHub Releases</span>
      <a href="https://github.com/Miyu3710/9mRoom/releases" target="_blank" rel="noreferrer">在 GitHub 查看原始发布记录</a>
    </footer>
  </main>

  <script>
    const manifests = {
      windows: 'https://raw.githubusercontent.com/Miyu3710/9mRoom/main/update-windows.json',
      server: 'https://raw.githubusercontent.com/Miyu3710/9mRoom/main/update-server.json',
      android: 'https://raw.githubusercontent.com/Miyu3710/9mRoom/main/update-android.json'
    };

    document.querySelectorAll('[data-latest]').forEach(async (node) => {
      const platform = node.dataset.latest;
      try {
        const response = await fetch(manifests[platform], { cache: 'no-store' });
        if (!response.ok) throw new Error('manifest');
        const data = await response.json();
        node.textContent = 'v' + String(data.version || '').replace(/^v/, '');
      } catch {
        node.textContent = '查看版本历史';
      }
    });
  </script>
</body>
</html>
